[project]
name = "flowextractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colored>=2.3.2",
    "pandas>=3.0.5",
    "scapy>=2.7.0",
    "torch>=2.14.0",
    "tqdm>=4.70.0",
]

[project.scripts]
flowextractor = "flowextractor.main:main"
flowrecorder = "flowextractor.recorder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowextractor"]
